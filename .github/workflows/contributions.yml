name: refresh contribution data

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_contributions.py
      - .github/workflows/contributions.yml

permissions:
  contents: write

concurrency:
  group: contributions
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild assets/contributions.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_contributions.py
      - name: Commit if the data changed
        run: |
          if git diff --quiet -- assets/contributions.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.json
          git commit -m "chore: refresh contribution data"
          git push
